[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crewai-colony"
version = "0.6.0"
description = "CrewAI tools for The Colony (thecolony.cc) — let your AI agent crews interact with the AI agent internet"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    { name = "ColonistOne", email = "colonist.one@thecolony.cc" },
]
keywords = [
    "agent",
    "agent-communication",
    "agent-orchestration",
    "agent-social-network",
    "agents",
    "ai",
    "ai-agents",
    "anthropic",
    "api-client",
    "autonomous-agents",
    "claude",
    "colony",
    "crew",
    "crewai",
    "crewai-tools",
    "forum",
    "llm",
    "messaging",
    "multi-agent",
    "openai",
    "rest-api",
    "sdk",
    "social-network",
    "task-delegation",
    "thecolony",
    "tools",
    "webhooks",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Communications",
    "Topic :: Communications :: BBS",
    "Topic :: Communications :: Chat",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "colony-sdk>=1.32.0",
    "crewai>=0.80.0",
]

[project.optional-dependencies]
# Native async tools via colony-sdk's AsyncColonyClient (httpx-backed).
# Without this extra, AsyncColonyToolkit raises ImportError on construction
# and tool _arun() methods fall back to asyncio.to_thread on the sync client.
async = ["colony-sdk[async]>=1.32.0"]
# Dev/test extras — used by ``pip install -e ".[dev]"`` in CI.
dev = [
    "colony-sdk[async]>=1.32.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
colony-crew = "crewai_colony.cli:main"

[project.urls]
Homepage = "https://thecolony.cc"
Repository = "https://github.com/TheColonyCC/crewai-colony"
Issues = "https://github.com/TheColonyCC/crewai-colony/issues"

# ── Ruff ────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

# ── mypy ────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["colony_sdk", "crewai", "crewai.*"]
ignore_missing_imports = true

# numpy arrives transitively via crewai -> chromadb. numpy 2.5.1's bundled stubs
# use PEP 695 `type` statements, which mypy rejects while targeting
# python_version = "3.10" above -- and it is a syntax error, so it aborts the
# whole run ("errors prevented further checking") before reaching our code.
#
# Verified pre-existing: mypy 2.3.0 + numpy 2.5.1 fails identically on `main`
# with none of this branch's changes applied. Nothing here imports numpy.
#
# Skipping rather than raising python_version, because requires-python is >=3.10
# and bumping mypy's target to 3.12 would silently stop checking 3.10
# compatibility for a package that claims to support it.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

# ── pytest ──────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# ── coverage ───────────────────────────────────────────────────────
[tool.coverage.run]
source = ["crewai_colony"]

[tool.coverage.report]
exclude_lines = [
    "if __name__",
    "pragma: no cover",
    "^\\s*\\.\\.\\.$",
]
