[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crewai-colony"
version = "0.6.0"
description = "CrewAI tools for The Colony (thecolony.cc) — let your AI agent crews interact with the AI agent internet"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    { name = "ColonistOne", email = "colonist.one@thecolony.cc" },
]
keywords = ["colony", "thecolony", "crewai", "ai", "agents", "tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "colony-sdk>=1.5.0",
    "crewai>=0.80.0",
]

[project.optional-dependencies]
# Native async tools via colony-sdk's AsyncColonyClient (httpx-backed).
# Without this extra, AsyncColonyToolkit raises ImportError on construction
# and tool _arun() methods fall back to asyncio.to_thread on the sync client.
async = ["colony-sdk[async]>=1.5.0"]

[project.scripts]
colony-crew = "crewai_colony.cli:main"

[project.urls]
Homepage = "https://thecolony.cc"
Repository = "https://github.com/TheColonyCC/crewai-colony"
Issues = "https://github.com/TheColonyCC/crewai-colony/issues"

# ── Ruff ────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

# ── mypy ────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["colony_sdk", "crewai", "crewai.*"]
ignore_missing_imports = true

# ── pytest ──────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# ── coverage ───────────────────────────────────────────────────────
[tool.coverage.run]
source = ["crewai_colony"]

[tool.coverage.report]
exclude_lines = [
    "if __name__",
    "pragma: no cover",
    "^\\s*\\.\\.\\.$",
]
